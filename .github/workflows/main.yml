name: APK oluştur

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Proje dosyalarını hazırla
        run: |
          if [ ! -f settings.gradle ]; then
            ZIP=$(ls *.zip 2>/dev/null | head -n 1)
            if [ -n "$ZIP" ]; then unzip -o -q "$ZIP"; fi
          fi
          if [ ! -f settings.gradle ]; then
            DIR=$(dirname "$(find . -maxdepth 3 -name settings.gradle | head -n 1)")
            if [ -n "$DIR" ] && [ "$DIR" != "." ]; then cp -r "$DIR"/. . ; fi
          fi
          test -f settings.gradle || { echo "settings.gradle bulunamadı. filmhane-android.zip dosyasını depoya yükle."; exit 1; }

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: APK derle
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: APK dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: Filmhane-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
